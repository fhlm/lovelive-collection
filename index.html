<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Love Live! 系列趴趴（寝そべりぬいぐるみ）收藏进度追踪">
<title>Love Live! 系列趴趴图鉴</title>
<style>
:root{
  --accent:#e94f8d; --accent-dark:#c63a74;
  --accent-gradient:linear-gradient(135deg,#ff8fc0 0%,#e94f8d 55%,#c63a74 100%);
  --cherry-light:#fff3f7; --cherry-dark:#a3265c;
  --text:#3d2b33; --text-sub:#8a6f7a;
  --card-bg:#ffffff; --border:#f0d3de; --divider:#f6e4ec;
  --progress-bg:#fbe4ee;
  --shadow:0 2px 10px rgba(201,84,132,.10); --shadow-hover:0 6px 18px rgba(201,84,132,.18);
  --bg:#fff8fb;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; min-height:100vh;
}
/* ---------- header ---------- */
.header{
  background:var(--accent-gradient); color:#fff;
  padding:38px 20px 34px; text-align:center; position:relative; overflow:hidden;
}
.lang-toggle{
  position:absolute; top:16px; right:16px; z-index:3;
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.55);
  color:#fff; font-size:12px; font-weight:600; padding:5px 14px;
  border-radius:99px; cursor:pointer; transition:background .2s;
}
.lang-toggle:hover{background:rgba(255,255,255,.38)}
.header h1{font-size:26px; font-weight:800; letter-spacing:.5px; text-shadow:0 2px 6px rgba(0,0,0,.12)}
.header .sub{margin-top:8px; font-size:13px; opacity:.95}
.header .sub small{display:block; margin-top:6px; font-size:11px; opacity:.82}
/* ---------- stats ---------- */
.stats{display:flex; justify-content:center; margin-top:-22px; position:relative; z-index:2; padding:0 12px}
.stat-card{
  width:320px; max-width:100%; background:var(--card-bg); border-radius:14px;
  padding:16px 18px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center;
}
.stat-label{font-size:12px; color:var(--text-sub)}
.stat-num{font-size:30px; font-weight:800; color:var(--accent-dark); margin:2px 0 8px}
.stat-num .small{font-size:15px; font-weight:700}
.stat-bar-track{height:8px; background:var(--progress-bg); border-radius:99px; overflow:hidden}
.stat-bar-fill{height:100%; background:var(--accent-gradient); border-radius:99px; transition:width .5s ease}
.stat-pct{margin-top:6px; font-size:12px; color:var(--text-sub)}
/* ---------- 悬浮进度条 ---------- */
#float-progress{
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:46px; display:flex; align-items:center; gap:10px; padding:0 16px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); box-shadow:0 3px 18px rgba(201,84,132,.16);
  transform:translateY(-102%); opacity:0;
  transition:transform .42s cubic-bezier(.22,.61,.36,1), opacity .32s ease;
  pointer-events:none;
}
#float-progress.show{transform:translateY(0); opacity:1; pointer-events:auto}
.fp-icon{font-size:14px; filter:drop-shadow(0 1px 2px rgba(201,84,132,.3))}
.fp-bar{flex:1; height:12px; background:var(--progress-bg); border-radius:99px; overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(201,84,132,.14)}
.fp-bar i{display:block; height:100%; width:0; background:var(--accent-gradient); border-radius:99px;
  transition:width .6s cubic-bezier(.22,.61,.36,1)}
.fp-text{font-size:12px; font-weight:800; color:var(--cherry-dark); white-space:nowrap;
  min-width:96px; text-align:right; letter-spacing:.2px}
/* ---------- layout ---------- */
.container{max-width:980px; margin:0 auto; padding:0 14px 40px}
.toolbar{
  background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  box-shadow:var(--shadow);
}
.toolbar select,.toolbar input{
  padding:8px 12px; border:1px solid #e0c8d0; border-radius:10px; font-size:13px;
  outline:none; background:var(--cherry-light); color:var(--text); min-width:110px;
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23c63a74' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; padding-right:26px;
}
.search-box{flex:1 1 180px; min-width:150px; appearance:auto; -webkit-appearance:auto; padding-right:12px}
.btn{
  border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
  cursor:pointer; color:#fff; background:var(--accent-gradient); transition:opacity .2s;
}
.btn:hover{opacity:.88}
.btn.danger{background:linear-gradient(135deg,#f6a6b5,#e0566f)}
/* ---------- 分组（系列+款式） ---------- */
.nui-group{
  background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); margin-top:12px; overflow:hidden; transition:box-shadow .2s;
}
.nui-group:hover{box-shadow:var(--shadow-hover)}
.group-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:12px 14px 10px; border-bottom:1px solid var(--divider);
  background:linear-gradient(180deg,#fffafb,#fff);
}
.group-title{font-size:15px; font-weight:800; color:var(--cherry-dark); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.group-title .ja{font-size:12px; font-weight:600; color:var(--text-sub)}
.size-badge{font-size:11px; font-weight:800; padding:2px 10px; border-radius:99px; background:var(--accent-gradient); color:#fff; white-space:nowrap}
.group-series{font-size:11px; padding:3px 10px; border-radius:99px; color:#fff; font-weight:700; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.25)}
.group-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:12px 14px}
.nui-card{
  position:relative; background:var(--cherry-light); border:2px solid transparent; border-radius:12px;
  padding:8px 8px 6px; cursor:pointer; transition:all .15s; user-select:none;
}
.nui-card:hover{border-color:#e8b8c9}
.nui-card.checked{border-color:var(--accent); background:#fff; box-shadow:0 2px 8px rgba(201,84,132,.14)}
.nui-card-check{
  position:absolute; top:4px; right:4px; z-index:2; width:20px; height:20px; border-radius:50%;
  background:#fff; border:2px solid #d9a8bb; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:transparent; transition:all .15s;
}
.nui-card.checked .nui-card-check{background:var(--accent-gradient); border-color:var(--accent); color:#fff}
.nui-card-zoom{
  position:absolute; top:4px; left:4px; z-index:2; width:20px; height:20px; border-radius:50%;
  background:rgba(255,255,255,.9); border:1px solid #e0c8d0; display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--cherry-dark); cursor:pointer; opacity:.75; transition:opacity .15s;
}
.nui-card-zoom:hover{opacity:1}
.nui-card-img{
  height:112px; display:flex; align-items:center; justify-content:center;
  background:#fff; border-radius:8px; overflow:hidden;
}
.nui-card-img img{max-width:100%; max-height:100%; object-fit:contain; transition:transform .15s}
.nui-card-img img:hover{transform:scale(1.08)}
.nui-card-name{font-size:12px; font-weight:700; color:var(--text); text-align:center; margin-top:5px; line-height:1.3}
.nui-card.checked .nui-card-name{color:var(--cherry-dark)}
.group-info{
  display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center;
  padding:10px 14px; border-top:1px solid var(--divider); background:#fffafb;
  font-size:12px; color:var(--text-sub);
}
.group-info b{color:var(--cherry-dark)}
.group-progress{margin-left:auto; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--cherry-dark)}
.group-progress .bar{width:72px; height:6px; border-radius:99px; background:var(--progress-bg); overflow:hidden}
.group-progress .bar i{display:block; height:100%; background:var(--accent-gradient); transition:width .3s}
/* ---------- empty / toast / footer ---------- */
#empty{text-align:center; padding:50px 0; color:var(--text-sub); font-size:14px}
.footer{background:#fff; border-top:1px solid var(--border); text-align:center; padding:22px 16px 30px; color:var(--text-sub); font-size:12px}
.footer div{margin-top:5px}
.footer .fb{font-size:13px; color:var(--cherry-dark); font-weight:700}
.footer .f-stat{margin-top:10px; font-size:10.5px; color:var(--text-sub)}
.footer .f-stat #busuanzi_value_site_pv,
.footer .f-stat #busuanzi_value_site_uv{font-weight:700; color:var(--cherry-dark); font-size:12px; margin:0 2px}
.toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
  background:rgba(61,43,51,.92); color:#fff; padding:9px 18px; border-radius:99px;
  font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:99;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* ---------- lightbox ---------- */
#lightbox{
  position:fixed; inset:0; background:rgba(20,8,14,.86); z-index:100;
  display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px;
}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw; max-height:76vh; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lightbox-name{color:#fff; margin-top:14px; font-size:14px; text-align:center; line-height:1.6}
.lb-close{
  position:absolute; top:18px; right:22px; color:#fff; font-size:34px; cursor:pointer;
  width:44px; height:44px; display:flex; align-items:center; justify-content:center; opacity:.85;
}
.lb-close:hover{opacity:1}
/* ---------- responsive ---------- */
@media (max-width:768px){
  .group-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
  .group-info{gap:4px 12px}
}
@media (max-width:480px){
  .header h1{font-size:21px}
  .group-title .ja{display:none}
  .group-grid{gap:8px; padding:10px}
  .nui-card{padding:6px 6px 5px}
  .nui-card-img{height:96px}
  .nui-card-name{font-size:11px}
  .nui-card-size{font-size:9px}
  .group-series{font-size:10px}
  .group-progress{margin-left:0; width:100%; justify-content:flex-end}
}
</style>
</head>

<div id="lightbox">

    }
    g.items.push(it);
    if (it.date < g.minDate) g.minDate = it.date;
    if (it.date > g.maxDate) g.maxDate = it.date;
  });
  return Object.values(map);
}

/*========== 渲染 ==========*/
let sortAsc = true;
function matchItem(it){
  const fRole = $('f-role').value;
  if (fRole && it.char !== fRole) return false;
  const fSize = $('f-size').value;
  if (fSize === '__none__') { if (it.size) return false; }
  else if (fSize !== '' && (it.size || '') !== fSize) return false;
  const kw = $('search').value.trim().toLowerCase();
  if (kw) {
    const hay = [it.char, it.charJa, it.type, it.typeZh, it.typeJa, it.series, it.seriesJa, it.size, it.version].join(' ').toLowerCase();
    if (hay.indexOf(kw) === -1) return false;
  }
  return true;
}
function cardHtml(it){
  const checked = isChecked(it.id);
  return `<div class="nui-card${checked ? ' checked' : ''}" data-id="${it.id}">
    <div class="nui-card-check">✓</div>
    <div class="nui-card-zoom" title="${esc(T('detailLink'))}" data-full="${esc(it.img)}"
         data-name="${esc(roleName(it) + ' · ' + typeName(it) + (it.size ? ' · ' + it.size : ''))}">🔍</div>
    <div class="nui-card-img">
      <img src="${esc(it.img)}" alt="${esc(roleName(it))}" loading="lazy">
    </div>
    <div class="nui-card-name">${esc(roleName(it))}</div>
  </div>`;
}
function groupHtml(g, vis){
  const vers = [];
  vis.forEach(i => { if (vers.indexOf(i.version) === -1) vers.push(i.version); });
  const checked = vis.filter(i => isChecked(i.id)).length;
  const total = vis.length;
  const pct = total ? Math.round(checked / total * 100) : 0;
  const dateRange = g.minDate === g.maxDate ? dateStr(g.minDate) : dateStr(g.minDate) + ' ～ ' + dateStr(g.maxDate);
  const t = typeName(g) || '—';
  const sizeBadge = g.size ? `<span class="size-badge">${esc(g.size)}</span>` : '';
  const sColor = SERIES_COLOR[g.series] || 'var(--accent-gradient)';
  return `<div class="nui-group" data-key="${esc(g.series + '|' + g.type + '|' + g.size)}">
    <div class="group-head">
      <div class="group-title">${esc(t)}${sizeBadge}</div>
      <div class="group-series" style="background:${sColor}">${esc(seriesLabel(g.series))}</div>
    </div>
    <div class="group-grid">${vis.map(cardHtml).join('')}</div>
    <div class="group-info">
      <span>📅 ${T('launchLabel')}：<b>${esc(dateRange)}</b></span>
      <span>${esc(vers.join(' / '))}</span>
      <span class="group-progress"><span class="gp-text">💗 ${checked}/${total}</span><span class="bar"><i style="width:${pct}%"></i></span></span>
    </div>
  </div>`;
}
function render(){
  const fSeries = $('f-series').value;
  const groups = buildGroups()
    .filter(g => !fSeries || g.series === fSeries)
    .map(g => ({ g, vis: g.items.filter(matchItem).sort((a, b) => charRank(a.char) - charRank(b.char)) }))
    .filter(x => x.vis.length > 0)
    .sort((a, b) => {
      const k = a.g.minDate < b.g.minDate ? -1 : a.g.minDate > b.g.minDate ? 1 : 0;
      return sortAsc ? k : -k;
    });
  $('item-list').innerHTML = groups.map(x => groupHtml(x.g, x.vis)).join('');
  $('empty').textContent = T('empty');
  $('empty').style.display = groups.length ? 'none' : 'block';
}
function updateStats(){
  let total = DATA.length, checked = 0;
  DATA.forEach(it => { if (isChecked(it.id)) checked++; });
  const pct = total ? Math.round(checked / total * 100) : 0;
  $('st-overall').innerHTML = pct + '<span class="small">%</span>';
  $('st-overall-bar').style.width = pct + '%';
  $('st-overall-pct').textContent = fill(T('stPct'), {c: checked, t: total});
  // 悬浮进度条同步
  $('fp-fill').style.width = pct + '%';
  $('fp-text').textContent = pct + '% · ' + fill(T('stPct'), {c: checked, t: total});
}
function updateGroup(grp){
  const cards = grp.querySelectorAll('.nui-card');
  const checked = [].filter.call(cards, c => isChecked(c.dataset.id)).length;
  const total = cards.length;
  const pct = total ? Math.round(checked / total * 100) : 0;
  const txt = grp.querySelector('.gp-text');
  if (txt) txt.textContent = '💗 ' + checked + '/' + total;
  const bar = grp.querySelector('.bar i');
  if (bar) bar.style.width = pct + '%';
}

/*========== 语言应用 ==========*/
function applyLang(){
  document.title = T('title');
  $('site-title').textContent = T('title');
  $('site-sub').textContent = T('subtitle');
  const note = fill(T('note'), {n: DATA.length, s: seriesList.map(s => seriesLabel(s) + ' ' + seriesCount[s]).join(' · ')});
  $('site-note').textContent = note;
  $('lang-toggle').textContent = T('langBtn');
  $('st-lbl-overall').textContent = T('stOverall');
  $('search').placeholder = T('searchPh');
  const sort = $('sort');
  sort.options[0].textContent = T('sortAsc');
  sort.options[1].textContent = T('sortDesc');
  $('btn-reset').textContent = T('reset');
  // 系列下拉
  const fs = $('f-series');
  const prevSeries = fs.value;
  fs.innerHTML = '';
  const osAll = document.createElement('option'); osAll.value = ''; osAll.textContent = T('allSeries'); fs.appendChild(osAll);
  seriesList.forEach(s => {
    const o = document.createElement('option');
    o.value = s;
    o.textContent = seriesLabel(s) + '（' + seriesCount[s] + '）';
    fs.appendChild(o);
  });
  if (prevSeries && seriesCount[prevSeries]) fs.value = prevSeries; else fs.value = '';
  // 尺寸下拉
  const fz = $('f-size');
  const prevSize = fz.value;
  fz.innerHTML = '';
  const ozAll = document.createElement('option'); ozAll.value = ''; ozAll.textContent = T('allSize'); fz.appendChild(ozAll);
  sizeList.forEach(s => {
    const o = document.createElement('option');
    o.value = s;
    o.textContent = (s || T('noSize')) + '（' + sizeCount[s] + '）';
    fz.appendChild(o);
  });
  if (sizeList.indexOf(prevSize) !== -1) fz.value = prevSize; else fz.value = '';
  // 角色下拉
  const fr = $('f-role');
  const prevRole = fr.value;
  fr.innerHTML = '';
  const orAll = document.createElement('option'); orAll.value = ''; orAll.textContent = T('allRole'); fr.appendChild(orAll);
  const roleMap = {};
  DATA.forEach(it => { roleMap[it.char] = it.charJa || it.char; });
  Object.keys(roleMap).forEach(cn => {
    const o = document.createElement('option');
    o.value = cn;
    o.textContent = lang === 'ja' ? roleMap[cn] + '（' + cn + '）' : cn + '（' + roleMap[cn] + '）';
    fr.appendChild(o);
  });
  if (prevRole && roleMap[prevRole]) fr.value = prevRole; else fr.value = '';
  $('footer-brand').textContent = T('footerBrand');
  $('footer-note').textContent = T('footerNote');
  $('footer-ack').textContent = T('footerAck');
  $('footer-thanks').textContent = T('thanks');
  $('footer-copy').textContent = T('footerCopy');
  $('f-stat-pv').textContent = T('pvSite');
  $('f-stat-pv-unit').textContent = T('pvUnit');
  $('f-stat-uv').textContent = T('uvSite');
  $('f-stat-uv-unit').textContent = T('uvUnit');
  render();
  updateStats();
}

/*========== 事件 ==========*/
/* 悬浮进度条：下滑超过阈值后从顶部滑出 */
const FP_THRESHOLD = 220;
window.addEventListener('scroll', () => {
  $('float-progress').classList.toggle('show', window.scrollY > FP_THRESHOLD);
}, { passive: true });
$('lang-toggle').addEventListener('click', () => {
  lang = lang === 'zh' ? 'ja' : 'zh';
  localStorage.setItem(LS_LANG, lang);
  applyLang();
});
$('search').addEventListener('input', render);
$('f-series').addEventListener('change', render);
$('f-size').addEventListener('change', render);
$('f-role').addEventListener('change', render);
$('sort').addEventListener('change', e => { sortAsc = e.target.value !== 'desc'; render(); });
$('item-list').addEventListener('click', e => {
  // 🔍 按钮 → 放大
  const zoom = e.target.closest('.nui-card-zoom');
  if (zoom) {
    $('lightbox-img').src = zoom.dataset.full;
    $('lightbox-name').textContent = zoom.dataset.name;
    $('lightbox').classList.add('open');
    return;
  }
  // 点击卡片任意处 → 勾选
  const card = e.target.closest('.nui-card');
  if (!card) return;
  const id = card.dataset.id;
  const on = !isChecked(id);
  setChecked(id, on);
  card.classList.toggle('checked', on);
  const grp = card.closest('.nui-group');
  if (grp) updateGroup(grp);
  updateStats();
});
function closeLightbox(){ $('lightbox').classList.remove('open'); }
$('lb-close').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
$('btn-reset').addEventListener('click', () => {
  if (!confirm(T('resetConfirm'))) return;
  state = {};
  saveState();
  render();
  updateStats();
  toast(T('cleared'));
});
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/*========== 启动 ==========*/
applyLang();
// 刷新时若已在页面下方，立即显示悬浮进度条
$('float-progress').classList.toggle('show', window.scrollY > FP_THRESHOLD);
</script>
