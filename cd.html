<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Love Live! 莲之空女学院 CD 收藏进度追踪">

<style>
:root{
  --accent:#e94f8d; --accent-dark:#c63a74;
  --accent-gradient:linear-gradient(135deg,#ff8fc0 0%,#e94f8d 55%,#c63a74 100%);
  --cherry-light:#fff3f7; --cherry-dark:#a3265c;
  --text:#3d2b33; --text-sub:#8a6f7a;
  --card-bg:#ffffff; --border:#f0d3de; --divider:#f6e4ec;
  --progress-bg:#fbe4ee;
  --shadow:0 2px 10px rgba(201,84,132,.10); --shadow-hover:0 6px 18px rgba(201,84,132,.18);
  --bg:#fff8fb;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; min-height:100vh;
}
/* ---------- header ---------- */
.header{
  background:var(--accent-gradient); color:#fff;
  padding:38px 20px 34px; text-align:center; position:relative; overflow:hidden;
}
.header-actions{position:absolute; top:16px; right:16px; z-index:3; display:flex; gap:8px}
.lang-toggle, .navlink{
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.55);
  color:#fff; font-size:12px; font-weight:600; padding:5px 14px;
  border-radius:99px; cursor:pointer; transition:background .2s; text-decoration:none; display:inline-block;
}
.lang-toggle:hover, .navlink:hover{background:rgba(255,255,255,.38)}
.header h1{font-size:26px; font-weight:800; letter-spacing:.5px; text-shadow:0 2px 6px rgba(0,0,0,.12)}
.header .sub{margin-top:8px; font-size:13px; opacity:.95}
.header .sub small{display:block; margin-top:6px; font-size:11px; opacity:.82}
/* ---------- stats ---------- */
.stats{display:flex; justify-content:center; margin-top:-22px; position:relative; z-index:2; padding:0 12px}
.stat-card{
  width:360px; max-width:100%; background:var(--card-bg); border-radius:14px;
  padding:16px 18px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center;
}
.stat-label{font-size:12px; color:var(--text-sub)}
.stat-num{font-size:30px; font-weight:800; color:var(--accent-dark); margin:2px 0 8px}
.stat-num .small{font-size:15px; font-weight:700}
.stat-bar-track{height:8px; background:var(--progress-bg); border-radius:99px; overflow:hidden}
.stat-bar-fill{height:100%; background:var(--accent-gradient); border-radius:99px; transition:width .5s ease}
.stat-pct{margin-top:6px; font-size:12px; color:var(--text-sub)}
.cat-chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px}
.cat-chip{
  font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:99px;
  background:var(--cherry-light); color:var(--cherry-dark); border:1px solid var(--border); white-space:nowrap;
}
/* ---------- 悬浮进度条 ---------- */
#float-progress{
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:46px; display:flex; align-items:center; gap:10px; padding:0 16px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); box-shadow:0 3px 18px rgba(201,84,132,.16);
  transform:translateY(-102%); opacity:0;
  transition:transform .42s cubic-bezier(.22,.61,.36,1), opacity .32s ease;
  pointer-events:none;
}
#float-progress.show{transform:translateY(0); opacity:1; pointer-events:auto}
.fp-icon{font-size:14px; filter:drop-shadow(0 1px 2px rgba(201,84,132,.3))}
.fp-bar{flex:1; height:12px; background:var(--progress-bg); border-radius:99px; overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(201,84,132,.14)}
.fp-bar i{display:block; height:100%; width:0; background:var(--accent-gradient); border-radius:99px;
  transition:width .6s cubic-bezier(.22,.61,.36,1)}
.fp-text{font-size:12px; font-weight:800; color:var(--cherry-dark); white-space:nowrap;
  min-width:96px; text-align:right; letter-spacing:.2px}
/* ---------- layout ---------- */
.container{max-width:980px; margin:0 auto; padding:0 14px 40px}
.toolbar{
  background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  box-shadow:var(--shadow); position:sticky; top:0; z-index:100;
}
.toolbar select,.toolbar input{
  padding:8px 12px; border:1px solid #e0c8d0; border-radius:10px; font-size:13px;
  outline:none; background:var(--cherry-light); color:var(--text); min-width:110px;
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23c63a74' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; padding-right:26px;
}
.search-box{flex:1 1 180px; min-width:150px; appearance:auto; -webkit-appearance:auto; padding-right:12px}
.btn{
  border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
  cursor:pointer; color:#fff; background:var(--accent-gradient); transition:opacity .2s;
}
.btn:hover{opacity:.88}
.btn.danger{background:linear-gradient(135deg,#f6a6b5,#e0566f)}
.btn.plain{background:#fff; color:var(--cherry-dark); border:1px solid var(--border)}
/* ---------- 年份分组 ---------- */
.cd-group{
  background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); margin-top:12px; overflow:hidden; transition:box-shadow .2s;
}
.cd-group:hover{box-shadow:var(--shadow-hover)}
.group-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:12px 14px 10px; border-bottom:1px solid var(--divider);
  background:linear-gradient(180deg,#fffafb,#fff);
}
.group-title{font-size:15px; font-weight:800; color:var(--cherry-dark); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.group-title .ja{font-size:12px; font-weight:600; color:var(--text-sub)}
.size-badge{font-size:11px; font-weight:800; padding:2px 10px; border-radius:99px; background:var(--accent-gradient); color:#fff; white-space:nowrap}
.group-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:12px 14px}
.cd-card{
  position:relative; background:var(--cherry-light); border:2px solid transparent; border-radius:12px;
  padding:8px 8px 6px; cursor:pointer; transition:all .15s; user-select:none;
}
.cd-card:hover{border-color:#e8b8c9}
.cd-card.checked{border-color:var(--accent); background:#fff; box-shadow:0 2px 8px rgba(201,84,132,.14)}
.cd-card-check{
  position:absolute; top:4px; right:4px; z-index:2; width:20px; height:20px; border-radius:50%;
  background:#fff; border:2px solid #d9a8bb; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:transparent; transition:all .15s;
}
.cd-card.checked .cd-card-check{background:var(--accent-gradient); border-color:var(--accent); color:#fff}
.cd-card-zoom{
  position:absolute; top:4px; left:4px; z-index:2; width:20px; height:20px; border-radius:50%;
  background:rgba(255,255,255,.9); border:1px solid #e0c8d0; display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--cherry-dark); cursor:pointer; opacity:.75; transition:opacity .15s;
}
.cd-card-zoom:hover{opacity:1}
.cd-card-img{
  height:128px; display:flex; align-items:center; justify-content:center;
  background:#fff; border-radius:8px; overflow:hidden;
}
.cd-card-img img{max-width:100%; max-height:100%; object-fit:contain; transition:transform .15s}
.cd-card-img img:hover{transform:scale(1.08)}
.cd-card-name{font-size:12px; font-weight:700; color:var(--text); text-align:center; margin-top:5px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.cd-card.checked .cd-card-name{color:var(--cherry-dark)}
.cd-card-type{font-size:10px; color:var(--text-sub); text-align:center; margin-top:2px; line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.cd-card-meta{display:flex; justify-content:space-between; gap:6px; margin-top:4px; font-size:10.5px; color:var(--text-sub)}
.cd-card-meta .price{font-weight:700; color:var(--cherry-dark)}
.group-info{
  display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center;
  padding:10px 14px; border-top:1px solid var(--divider); background:#fffafb;
  font-size:12px; color:var(--text-sub);
}
.group-info b{color:var(--cherry-dark)}
.group-progress{margin-left:auto; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--cherry-dark)}
.group-progress .bar{width:72px; height:6px; border-radius:99px; background:var(--progress-bg); overflow:hidden}
.group-progress .bar i{display:block; height:100%; background:var(--accent-gradient); transition:width .3s}
/* ---------- empty / toast / footer ---------- */
#empty{text-align:center; padding:50px 0; color:var(--text-sub); font-size:14px}
.footer{background:#fff; border-top:1px solid var(--border); text-align:center; padding:22px 16px 30px; color:var(--text-sub); font-size:12px}
.footer div{margin-top:5px}
.footer .fb{font-size:13px; color:var(--cherry-dark); font-weight:700}
.footer .f-stat{margin-top:10px; font-size:10.5px; color:var(--text-sub)}
.footer .f-stat #busuanzi_value_site_pv,
.footer .f-stat #busuanzi_value_site_uv{font-weight:700; color:var(--cherry-dark); font-size:12px; margin:0 2px}
.toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
  background:rgba(61,43,51,.92); color:#fff; padding:9px 18px; border-radius:99px;
  font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:99;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* ---------- 详情弹层 ---------- */
#lightbox{
  position:fixed; inset:0; background:rgba(20,8,14,.86); z-index:100;
  display:none; align-items:center; justify-content:center; padding:20px;
}
#lightbox.open{display:flex}
.lb-panel{
  background:#fff; border-radius:16px; max-width:680px; width:100%; max-height:86vh;
  overflow:auto; padding:18px 18px 16px; position:relative;
}
.lb-close{
  position:absolute; top:8px; right:12px; color:var(--text-sub); font-size:30px; cursor:pointer;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center; opacity:.85;
}
.lb-close:hover{opacity:1}
.lb-body{display:flex; gap:16px; flex-wrap:wrap}
.lb-cover{width:210px; flex:0 0 auto; text-align:center}
.lb-cover img{width:100%; border-radius:12px; box-shadow:var(--shadow-hover)}
.lb-info{flex:1 1 260px; min-width:240px}
.lb-type{font-size:11.5px; font-weight:700; color:#fff; background:var(--accent-gradient);
  display:inline-block; padding:3px 12px; border-radius:99px; margin-bottom:8px; line-height:1.5}
.lb-title{font-size:19px; font-weight:800; color:var(--cherry-dark); line-height:1.35}
.lb-meta{margin-top:10px; font-size:12.5px; color:var(--text-sub); display:flex; flex-wrap:wrap; gap:4px 18px}
.lb-meta b{color:var(--cherry-dark)}
.lb-songs{margin-top:12px}
.lb-songs h4{font-size:12.5px; color:var(--cherry-dark); margin-bottom:6px}
.lb-songlist{
  background:var(--cherry-light); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; font-size:12px; line-height:1.75; color:var(--text);
  max-height:220px; overflow:auto; white-space:pre-wrap;
}
.lb-actions{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
/* ---------- responsive ---------- */
@media (max-width:768px){
  .group-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
  .group-info{gap:4px 12px}
  .toolbar{flex-wrap:wrap}
  .toolbar select,.toolbar input{min-width:100px; font-size:12px}
  .search-box{flex:1 1 120px; min-width:120px}
}
@media (max-width:480px){
  .header h1{font-size:21px}
  .group-title .ja{display:none}
  .group-grid{gap:8px; padding:10px}
  .cd-card{padding:6px 6px 5px}
  .cd-card-img{height:104px}
  .cd-card-name{font-size:11px}
  .group-progress{margin-left:0; width:100%; justify-content:flex-end}
  .toolbar{gap:8px; padding:10px}
  .toolbar select,.toolbar input{min-width:90px; font-size:11px; padding:6px 8px}
  .search-box{flex:1 1 100px; min-width:100px}
  .lb-cover{width:150px}
}
</style>
</head>

    note:'収録 {n} 枚 · チェックして収集状況を記録 · 進捗はブラウザに保存 · 公式サイト音楽商品ページより整理（{d}）',
    langBtn:'中文',
    stOverall:'総進捗',
    stPct:'{c} / {t} 枚',
    allCat:'全タイプ', allStatus:'全ステータス', ownedOnly:'収集済み', unownedOnly:'未収集',
    searchPh:'🔍 タイトル / 種別 / 楽曲検索…',
    sortAsc:'📅 発売順 古→新', sortDesc:'📅 発売順 新→古',
    reset:'🗑️ リセット', resetConfirm:'すべての進捗を消去しますか？元に戻せません。',
    launchLabel:'発売', priceLabel:'価格', detailLink:'公式ページ',
    songsHead:'収録曲', toggleOwned:'✓ 収集済みにする', toggleUnowned:'収集済みを解除',
    checkedLabel:'収集済み',
    empty:'該当するCDがありません。条件を変えてみてください～',
    cleared:'進捗を消去しました',
    footerBrand:'蓮ノ空 CD図鑑 · 非公式ファンサイト',
    footerNote:'データ元：蓮ノ空女学院スクールアイドルクラブ 公式サイト 音楽商品ページ（lovelive-anime.jp/hasunosora/music/cd/）。価格は税込円表示、公式未掲載は「未発表」。',
    footerAck:'本ページは AI による整理です · 誤りや欠落がある可能性があります · 個人学習用 · 商用利用禁止 · 権利は各権利者に帰属',
    footerCopy:'ラブライブ！シリーズの著作権は各権利者に帰属します · 非公式ファンツール',
    pvSite:'サイト訪問数', pvUnit:'回', uvSite:'訪問者', uvUnit:'人',
    navNui:'🧸 ぬい図鑑',
    cat:{ single:'シングル', mini:'ミニアルバム', album:'アルバム', special:'SPECIALアルバム', grad:'卒業アルバム', ost:'サウンドトラック', other:'その他' },
  }
};
const LS_LANG = 'll-cd-lang';
const LS_KEY = 'll-cd-progress-v1';
const CAT_ORDER = ['single','mini','album','special','grad','ost','other'];

/*========== 分类 ==========*/
function catOf(type){
  if (type.indexOf('Graduation Album') >= 0 || type.indexOf('卒業') >= 0) return 'grad';
  if (type.indexOf('SPECIALアルバム') >= 0) return 'special';
  if (type.indexOf('ミニアルバム') >= 0) return 'mini';
  if (type.indexOf('サウンドトラック') >= 0) return 'ost';
  if (type.indexOf('アルバム') >= 0) return 'album';
  if (type.indexOf('シングル') >= 0 || type.indexOf('テーマソング') >= 0) return 'single';
  return 'other';
}
CD_DATA.forEach(it => { it.cat = catOf(it.type); it.year = (it.sortKey || '').slice(0, 4); });

let lang = localStorage.getItem(LS_LANG) || ((navigator.language||'').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'zh');
if (!I18N[lang]) lang = 'zh';
const T = k => (I18N[lang] && I18N[lang][k]) || k;
const fill = (tpl, map) => tpl.replace(/\{(\w+)\}/g, (m, k) => (k in map ? map[k] : m));

/*========== 收藏状态 ==========*/
let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { state = {}; }
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function isChecked(id){ return !!state[id]; }
function setChecked(id, on){ if(on) state[id] = true; else delete state[id]; saveState(); }

/*========== 统计 ==========*/
const catCount = {};
CAT_ORDER.forEach(c => catCount[c] = 0);
CD_DATA.forEach(it => catCount[it.cat]++);
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function priceStr(p){ return (p === '未公布') ? (lang === 'ja' ? '未発表' : '未公布') : p; }

/*========== 渲染 ==========*/
let sortAsc = true;
function matchItem(it){
  const fCat = $('f-cat').value;
  if (fCat && it.cat !== fCat) return false;
  const fSt = $('f-status').value;
  if (fSt === 'owned' && !isChecked(it.id)) return false;
  if (fSt === 'unowned' && isChecked(it.id)) return false;
  const kw = $('search').value.trim().toLowerCase();
  if (kw) {
    const hay = [it.title, it.type, it.price, it.date, (it.songs||[]).join(' ')].join(' ').toLowerCase();
    if (hay.indexOf(kw) === -1) return false;
  }
  return true;
}
function cardHtml(it){
  const checked = isChecked(it.id);
  return `<div class="cd-card${checked ? ' checked' : ''}" data-id="${it.id}">
    <div class="cd-card-check">✓</div>
    <div class="cd-card-zoom" title="${esc(T('songsHead'))}" data-id="${it.id}">🔍</div>
    <div class="cd-card-img">
      <img src="${esc(it.img)}" alt="${esc(it.title)}" loading="lazy">
    </div>
    <div class="cd-card-name">${esc(it.title)}</div>
    <div class="cd-card-type">${esc(it.type)}</div>
    <div class="cd-card-meta"><span>${esc(it.date)}</span><span class="price">${esc(priceStr(it.price))}</span></div>
  </div>`;
}
function groupHtml(year, vis){
  const checked = vis.filter(i => isChecked(i.id)).length;
  const total = vis.length;
  const pct = total ? Math.round(checked / total * 100) : 0;
  return `<div class="cd-group" data-year="${esc(year)}">
    <div class="group-head">
      <div class="group-title">${esc(year)}<span class="ja">${esc(T('launchLabel'))}</span></div>
      <div class="size-badge">${total}</div>
    </div>
    <div class="group-grid">${vis.map(cardHtml).join('')}</div>
    <div class="group-info">
      <span>📅 ${T('launchLabel')}：<b>${esc(year)}</b></span>
      <span class="group-progress"><span class="gp-text">💿 ${checked}/${total}</span><span class="bar"><i style="width:${pct}%"></i></span></span>
    </div>
  </div>`;
}
function render(){
  const vis = CD_DATA.filter(matchItem);
  const years = [];
  vis.forEach(it => { if (years.indexOf(it.year) === -1) years.push(it.year); });
  years.sort((a, b) => sortAsc ? (a < b ? -1 : 1) : (a > b ? -1 : 1));
  $('item-list').innerHTML = years.map(y =>
    groupHtml(y, vis.filter(it => it.year === y).sort((a, b) =>
      sortAsc ? (a.sortKey < b.sortKey ? -1 : 1) : (a.sortKey > b.sortKey ? -1 : 1)))
  ).join('');
  $('empty').textContent = T('empty');
  $('empty').style.display = years.length ? 'none' : 'block';
}
function updateStats(){
  const total = CD_DATA.length;
  let checked = 0;
  CD_DATA.forEach(it => { if (isChecked(it.id)) checked++; });
  const pct = total ? Math.round(checked / total * 100) : 0;
  $('st-overall').innerHTML = pct + '<span class="small">%</span>';
  $('st-overall-bar').style.width = pct + '%';
  $('st-overall-pct').textContent = fill(T('stPct'), {c: checked, t: total});
  $('fp-fill').style.width = pct + '%';
  $('fp-text').textContent = pct + '% · ' + fill(T('stPct'), {c: checked, t: total});
  // 分类小徽章
  $('cat-chips').innerHTML = CAT_ORDER.filter(c => catCount[c]).map(c => {
    const got = CD_DATA.filter(it => it.cat === c && isChecked(it.id)).length;
    return `<span class="cat-chip">${esc(T('cat')[c])} ${got}/${catCount[c]}</span>`;
  }).join('');
}
function updateGroup(grp){
  const cards = grp.querySelectorAll('.cd-card');
  const checked = [].filter.call(cards, c => isChecked(c.dataset.id)).length;
  const total = cards.length;
  const pct = total ? Math.round(checked / total * 100) : 0;
  const txt = grp.querySelector('.gp-text');
  if (txt) txt.textContent = '💿 ' + checked + '/' + total;
  const bar = grp.querySelector('.bar i');
  if (bar) bar.style.width = pct + '%';
}

/*========== 详情弹层 ==========*/
let lbId = null;
function openLightbox(id){
  const it = CD_DATA.find(x => x.id === id);
  if (!it) return;
  lbId = id;
  $('lb-img').src = it.img;
  $('lb-img').alt = it.title;
  $('lb-type').textContent = it.type;
  $('lb-title').textContent = it.title;
  $('lb-date').innerHTML = '📅 ' + esc(T('launchLabel')) + '：<b>' + esc(it.date) + '</b>';
  $('lb-price').innerHTML = '💰 ' + esc(T('priceLabel')) + '：<b>' + esc(priceStr(it.price)) + '</b>';
  $('lb-songs-head').textContent = '🎵 ' + T('songsHead');
  $('lb-songs').textContent = (it.songs && it.songs.length) ? it.songs.join('\n') : '—';
  const link = $('lb-link');
  link.href = it.url || '#';
  link.textContent = '🔗 ' + T('detailLink');
  link.style.display = it.url ? 'inline-block' : 'none';
  $('lb-toggle').textContent = isChecked(id) ? T('toggleUnowned') : T('toggleOwned');
  $('lightbox').classList.add('open');
}
function closeLightbox(){ $('lightbox').classList.remove('open'); lbId = null; }
function toggleFromLightbox(){
  if (!lbId) return;
  const on = !isChecked(lbId);
  setChecked(lbId, on);
  const card = document.querySelector('.cd-card[data-id="' + lbId + '"]');
  if (card) {
    card.classList.toggle('checked', on);
    const grp = card.closest('.cd-group');
    if (grp) updateGroup(grp);
  }
  $('lb-toggle').textContent = on ? T('toggleUnowned') : T('toggleOwned');
  updateStats();
}

/*========== 语言应用 ==========*/
function applyLang(){
  document.title = T('title');
  $('site-title').textContent = T('title');
  $('site-sub').textContent = T('subtitle');
  $('site-note').textContent = fill(T('note'), {n: CD_DATA.length, d: '2026-09-28'});
  $('lang-toggle').textContent = T('langBtn');
  $('navlink').textContent = T('navNui');
  $('st-lbl-overall').textContent = T('stOverall');
  $('search').placeholder = T('searchPh');
  const sort = $('sort');
  sort.options[0].textContent = T('sortAsc');
  sort.options[1].textContent = T('sortDesc');
  $('btn-reset').textContent = T('reset');
  // 类型下拉
  const fc = $('f-cat');
  const prevCat = fc.value;
  fc.innerHTML = '';
  const ocAll = document.createElement('option'); ocAll.value = ''; ocAll.textContent = T('allCat'); fc.appendChild(ocAll);
  CAT_ORDER.filter(c => catCount[c]).forEach(c => {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = T('cat')[c] + '（' + catCount[c] + '）';
    fc.appendChild(o);
  });
  if (prevCat && catCount[prevCat]) fc.value = prevCat; else fc.value = '';
  // 状态下拉
  const fs = $('f-status');
  const prevSt = fs.value;
  fs.innerHTML = '';
  [['', T('allStatus')], ['owned', T('ownedOnly')], ['unowned', T('unownedOnly')]].forEach(([v, t]) => {
    const o = document.createElement('option'); o.value = v; o.textContent = t; fs.appendChild(o);
  });
  if (prevSt) fs.value = prevSt;
  $('footer-brand').textContent = T('footerBrand');
  $('footer-note').textContent = T('footerNote');
  $('footer-ack').textContent = T('footerAck');
  $('footer-copy').textContent = T('footerCopy');
  $('f-stat-pv').textContent = T('pvSite');
  $('f-stat-pv-unit').textContent = T('pvUnit');
  $('f-stat-uv').textContent = T('uvSite');
  $('f-stat-uv-unit').textContent = T('uvUnit');
  render();
  updateStats();
}

/*========== 事件 ==========*/
const FP_THRESHOLD = 220;
window.addEventListener('scroll', () => {
  $('float-progress').classList.toggle('show', window.scrollY > FP_THRESHOLD);
}, { passive: true });
$('lang-toggle').addEventListener('click', () => {
  lang = lang === 'zh' ? 'ja' : 'zh';
  localStorage.setItem(LS_LANG, lang);
  applyLang();
});
$('search').addEventListener('input', render);
$('f-cat').addEventListener('change', render);
$('f-status').addEventListener('change', render);
$('sort').addEventListener('change', e => { sortAsc = e.target.value !== 'desc'; render(); });
$('item-list').addEventListener('click', e => {
  // 🔍 按钮 → 详情弹层
  const zoom = e.target.closest('.cd-card-zoom');
  if (zoom) { openLightbox(zoom.dataset.id); return; }
  // 点击卡片任意处 → 勾选
  const card = e.target.closest('.cd-card');
  if (!card) return;
  const id = card.dataset.id;
  const on = !isChecked(id);
  setChecked(id, on);
  card.classList.toggle('checked', on);
  const grp = card.closest('.cd-group');
  if (grp) updateGroup(grp);
  updateStats();
});
$('lb-close').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });
$('lb-toggle').addEventListener('click', toggleFromLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
$('btn-reset').addEventListener('click', () => {
  if (!confirm(T('resetConfirm'))) return;
  state = {};
  saveState();
  render();
  updateStats();
  toast(T('cleared'));
});
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/*========== 启动 ==========*/
applyLang();
$('float-progress').classList.toggle('show', window.scrollY > FP_THRESHOLD);
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
